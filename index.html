<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Invaders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #eee;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 2rem;
            color: #ff6600;
            text-shadow: 0 0 15px #ff660066;
        }
        #hud {
            display: flex;
            gap: 40px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        #hud .score { color: #00ccff; }
        #hud .lives { color: #ff4444; }
        #hud .level { color: #ffcc00; }
        canvas {
            border: 2px solid #ff6600;
            border-radius: 4px;
            box-shadow: 0 0 30px #ff660022;
            background: #05051a;
        }
        #controls {
            margin-top: 15px;
            color: #666;
            font-size: 0.85rem;
        }
        #overlay {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            padding: 50px;
            border-radius: 12px;
            border: 2px solid #ff6600;
            text-align: center;
            z-index: 10;
        }
        #overlay h2 { font-size: 2.2rem; margin-bottom: 15px; }
        #overlay p { margin-bottom: 20px; font-size: 1.1rem; color: #ccc; }
        #overlay button {
            background: #ff6600;
            color: #fff;
            border: none;
            padding: 14px 35px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        #overlay button:hover { background: #cc5200; }
        #mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }
        #mobile-controls button {
            width: 70px; height: 55px;
            font-size: 1.4rem;
            background: #1a1a3e;
            color: #ff6600;
            border: 2px solid #ff6600;
            border-radius: 8px;
            touch-action: manipulation;
        }
        #mobile-controls button:active { background: #ff6600; color: #fff; }
        @media (max-width: 600px) {
            #mobile-controls { display: flex; }
            canvas { max-width: 95vw; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <h1>👾 GALAXY INVADERS</h1>
    <div id="hud">
        <span class="score">Score: <span id="score">0</span></span>
        <span class="level">Level: <span id="level">1</span></span>
        <span class="lives">Lives: <span id="lives">3</span></span>
    </div>
    <canvas id="game" width="560" height="600"></canvas>
    <div id="controls">← → or A/D to move | Space to shoot</div>
    <div id="mobile-controls">
        <button ontouchstart="mobileLeft=true" ontouchend="mobileLeft=false">◀</button>
        <button ontouchstart="mobileShoot()">🔫</button>
        <button ontouchstart="mobileRight=true" ontouchend="mobileRight=false">▶</button>
    </div>
    <div id="overlay">
        <h2 id="overlay-title">GAME OVER</h2>
        <p id="overlay-text">Score: 0</p>
        <button onclick="startGame()">PLAY AGAIN</button>
    </div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    let player, bullets, enemyBullets, enemies, particles, stars;
    let score, lives, level, gameOver, gameWon, frameCount;
    let keys = {};
    let mobileLeft = false, mobileRight = false;
    let enemyDir, enemySpeed, enemyDropTimer, shootTimer;

    // Stars background
    function createStars() {
        stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, speed: Math.random() * 0.5 + 0.2 });
        }
    }

    function drawStars() {
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5 + 0.3})`;
            ctx.fillRect(s.x, s.y, s.s, s.s);
            s.y += s.speed;
            if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        });
    }

    function createEnemies() {
        enemies = [];
        const rows = Math.min(4 + Math.floor(level / 2), 6);
        const cols = Math.min(8 + Math.floor(level / 3), 11);
        const types = ['👾', '👽', '🛸'];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                enemies.push({
                    x: 60 + c * 48,
                    y: 50 + r * 45,
                    w: 32, h: 32,
                    type: types[r % 3],
                    alive: true,
                    points: (3 - (r % 3)) * 10 + 10
                });
            }
        }
        enemyDir = 1;
        enemySpeed = 0.4 + level * 0.15;
        enemyDropTimer = 0;
    }

    function init() {
        player = { x: W / 2 - 20, y: H - 60, w: 40, h: 30, speed: 5 };
        bullets = [];
        enemyBullets = [];
        particles = [];
        score = 0;
        lives = 3;
        level = 1;
        gameOver = false;
        gameWon = false;
        frameCount = 0;
        shootTimer = 0;
        createStars();
        createEnemies();
        updateHUD();
        document.getElementById('overlay').style.display = 'none';
    }

    function updateHUD() {
        document.getElementById('score').textContent = score;
        document.getElementById('lives').textContent = lives;
        document.getElementById('level').textContent = level;
    }

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                life: 30 + Math.random() * 20,
                color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function shoot() {
        if (shootTimer > 0) return;
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
        shootTimer = 15;
    }

    function mobileShoot() { shoot(); }

    function update() {
        if (gameOver) return;
        frameCount++;
        shootTimer = Math.max(0, shootTimer - 1);

        // Player movement
        if (keys['ArrowLeft'] || keys['a'] || keys['A'] || mobileLeft) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d'] || keys['D'] || mobileRight) player.x += player.speed;
        player.x = Math.max(0, Math.min(W - player.w, player.x));

        // Bullets
        bullets.forEach(b => b.y -= 7);
        bullets = bullets.filter(b => b.y > -20);

        // Enemy bullets
        enemyBullets.forEach(b => b.y += 4 + level * 0.5);
        enemyBullets = enemyBullets.filter(b => b.y < H + 20);

        // Enemy movement
        let hitEdge = false;
        enemies.filter(e => e.alive).forEach(e => {
            e.x += enemyDir * enemySpeed;
            if (e.x <= 5 || e.x + e.w >= W - 5) hitEdge = true;
        });
        if (hitEdge) {
            enemyDir *= -1;
            enemies.filter(e => e.alive).forEach(e => e.y += 18);
        }

        // Enemy shooting
        const aliveEnemies = enemies.filter(e => e.alive);
        if (aliveEnemies.length > 0 && frameCount % Math.max(40 - level * 3, 15) === 0) {
            const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
            enemyBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 10 });
        }

        // Bullet-enemy collision
        bullets.forEach(b => {
            enemies.filter(e => e.alive).forEach(e => {
                if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                    e.alive = false;
                    b.y = -100;
                    score += e.points;
                    spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff6600', 8);
                    updateHUD();
                }
            });
        });

        // Enemy bullet-player collision
        enemyBullets.forEach(b => {
            if (b.x < player.x + player.w && b.x + b.w > player.x && b.y < player.y + player.h && b.y + b.h > player.y) {
                b.y = H + 100;
                lives--;
                spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#00ccff', 12);
                updateHUD();
                if (lives <= 0) endGame(false);
            }
        });

        // Enemy reaches player
        aliveEnemies.forEach(e => {
            if (e.y + e.h >= player.y) endGame(false);
        });

        // Particles
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            p.vx *= 0.96;
            p.vy *= 0.96;
        });
        particles = particles.filter(p => p.life > 0);

        // Level complete
        if (aliveEnemies.length === 0) {
            level++;
            createEnemies();
            updateHUD();
        }
    }

    function draw() {
        ctx.fillStyle = '#05051a';
        ctx.fillRect(0, 0, W, H);
        drawStars();

        // Player ship
        ctx.font = '30px serif';
        ctx.textAlign = 'center';
        ctx.fillText('🚀', player.x + player.w / 2, player.y + player.h);

        // Player bullets
        ctx.fillStyle = '#00ccff';
        ctx.shadowColor = '#00ccff';
        ctx.shadowBlur = 8;
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
        ctx.shadowBlur = 0;

        // Enemy bullets
        ctx.fillStyle = '#ff4444';
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 6;
        enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
        ctx.shadowBlur = 0;

        // Enemies
        ctx.font = '28px serif';
        ctx.textAlign = 'center';
        enemies.filter(e => e.alive).forEach(e => {
            ctx.fillText(e.type, e.x + e.w / 2, e.y + e.h - 2);
        });

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life / 50;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1;
    }

    function endGame(won) {
        gameOver = true;
        const overlay = document.getElementById('overlay');
        document.getElementById('overlay-title').textContent = won ? 'YOU WIN!' : 'GAME OVER';
        document.getElementById('overlay-title').style.color = won ? '#00ff88' : '#ff4444';
        document.getElementById('overlay-text').textContent = `Score: ${score} | Level: ${level}`;
        overlay.style.display = 'block';
    }

    function startGame() { init(); }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', e => {
        keys[e.key] = true;
        if (e.key === ' ') { e.preventDefault(); shoot(); }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    init();
    gameLoop();
    </script>
</body>
</html>
